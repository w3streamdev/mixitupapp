steps:
  - name: node:22
    id: test
    entrypoint: bash
    args:
      - -lc
      - |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm ci

  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/mixitup-services/api:$SHORT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/mixitup-services/api:staging
      - -f
      - apps/api/Dockerfile
      - .
    waitFor: [test]

  - name: gcr.io/cloud-builders/docker
    id: build-worker
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/mixitup-services/worker:$SHORT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/mixitup-services/worker:staging
      - -f
      - apps/worker/Dockerfile
      - .
    waitFor: [test]

  - name: gcr.io/cloud-builders/docker
    id: push-api
    args: [push, --all-tags, "$_REGION-docker.pkg.dev/$PROJECT_ID/mixitup-services/api"]
    waitFor: [build-api]

  - name: gcr.io/cloud-builders/docker
    id: push-worker
    args: [push, --all-tags, "$_REGION-docker.pkg.dev/$PROJECT_ID/mixitup-services/worker"]
    waitFor: [build-worker]

  - name: node:22
    id: migrate
    entrypoint: bash
    args:
      - -lc
      - |
        corepack enable
        pnpm --filter @mixitup/db prisma:deploy
    waitFor: [test]

  - name: gcr.io/cloud-builders/gcloud
    id: deploy-api
    args:
      - run
      - deploy
      - mixitup-api-staging
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/mixitup-services/api:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --quiet
    waitFor: [push-api, migrate]

  - name: gcr.io/cloud-builders/gcloud
    id: deploy-worker
    args:
      - run
      - deploy
      - mixitup-worker-staging
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/mixitup-services/worker:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --quiet
    waitFor: [push-worker, migrate]

substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
