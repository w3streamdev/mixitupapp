steps:
  # ─── Install & Test ──────────────────────────────────────────────────
  - name: node:22
    id: test
    entrypoint: bash
    args:
      - -lc
      - |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm lint
        pnpm typecheck
        pnpm test
        pnpm build
options:
  logging: CLOUD_LOGGING_ONLY
